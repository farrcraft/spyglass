# CI (ADR 0028): every check, and one oracle job per supported game version. Each oracle job
# downloads its server jar from Mojang, extracts the bundle and regenerates every oracle output
# in a fresh runner; nothing derived from the game is cached or uploaded (ADR 0008). The jobs
# only call `cargo xtask`, so they run the same locally.
name: CI

# Pushes to main, and pull requests: a branch with a pull request runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The viewer's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev
      - name: The JDK major the latest release needs
        id: jdk
        run: echo "major=$(cargo xtask jdk-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      # The cargo tools setup.sh installs take minutes to compile. Only tools are cached, never
      # anything derived from the game (ADR 0008); the key changes when their versions do.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-shear
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}
      - name: Setup
        run: scripts/setup.sh --oracle
      - run: cargo xtask check

  # Windows is the main development OS: the same checks there, set up by setup.ps1 (ADR 0035).
  # The oracle jobs stay on Linux, since their results don't depend on the OS.
  check-windows:
    name: cargo xtask check (Windows)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-shear.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('scripts/setup.ps1') }}
      - name: Setup
        shell: pwsh
        run: |
          ./scripts/setup.ps1
          # setup.ps1 puts pre-commit on this step's PATH only; later steps need it too.
          "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH
      - run: cargo xtask check

  oracle:
    name: oracle ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every supported version, permanently (ADR 0028). docs/adding-a-version.md adds to it.
        version:
          - "26.2"
          - "26.3"
          - "26.4-snapshot-5"
          - "26.4-snapshot-6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The JDK major ${{ matrix.version }} needs
        id: jdk
        run: |
          echo "major=$(cargo xtask jdk-status --game-version '${{ matrix.version }}' | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      # `oracle locate` runs Mojang's dedicated server; this accepts the Minecraft EULA for it
      # (https://aka.ms/MinecraftEULA, ADR 0033).
      - run: cargo xtask ci --game-version '${{ matrix.version }}'
        env:
          SPYGLASS_ACCEPT_EULA: "1"
