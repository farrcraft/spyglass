# CI (ADR 0028): every check, and the oracle jobs for every supported game version. Each oracle
# job downloads its server jar from Mojang, extracts the bundle and regenerates the oracle outputs
# it tests in a fresh runner; nothing derived from the game is cached or uploaded (ADR 0008). The
# jobs only call `cargo xtask`, so they run the same locally.
#
# A pull request runs only the jobs its files can affect, which `cargo xtask ci-scope` decides;
# a push to main, the weekly run and the release workflow run everything (ADR 0041).
# `cargo xtask ci-plan` divides the oracle work into jobs that fit the hour (ADR 0058). A pull
# request and a push to main check the newest release and snapshot in full, older releases in
# part and older snapshots not at all, unless the pull request has the `oracle: full` label; the
# weekly run and the release check every version in full (ADR 0067).
name: CI

# Pushes to main, and pull requests: a branch with a pull request runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  # Every version in full, weekly, on main (ADR 0067): Mondays at 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # The release workflow runs all of this on the commit it releases, before it builds (ADR 0037).
  workflow_call:

# A newer push to the same ref cancels the run it supersedes. The weekly run has a group of its
# own, so a push to main doesn't cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: What to run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      check: ${{ steps.scope.outputs.check }}
      windows: ${{ steps.scope.outputs.windows }}
      oracle: ${{ steps.scope.outputs.oracle }}
      docs: ${{ steps.scope.outputs.docs }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, to diff against.
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          FULL: "${{ contains(github.event.pull_request.labels.*.name, 'oracle: full') }}"
        run: |
          if [ "$EVENT" = pull_request ]; then
            cargo xtask ci-scope --base "origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
            if [ "$FULL" = true ]; then
              cargo xtask ci-plan --mode full >> "$GITHUB_OUTPUT"
            else
              cargo xtask ci-plan --mode pr --base "origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
            fi
          else
            # A push to main checks what a pull request does; the weekly run and the release,
            # every version in full.
            if [ "$EVENT" = push ]; then
              cargo xtask ci-plan --mode main >> "$GITHUB_OUTPUT"
            else
              cargo xtask ci-plan --mode full >> "$GITHUB_OUTPUT"
            fi
            echo "check=true" >> "$GITHUB_OUTPUT"
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # A pull request that changes only docs: the commit-stage hooks (links, formatting, spelling)
  # instead of the whole check. cargo-shear is skipped: it reads Rust, and isn't installed here.
  docs:
    name: docs
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The guide hook builds the user guide with mdBook. Cached, since it takes minutes to compile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mdbook
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook@0.5.4
      # Keep the versions in step with the setup scripts; an xtask test checks them.
      - if: steps.mdbook.outputs.cache-hit != 'true'
        run: cargo install --locked mdbook@0.5.4
      # Keep the version in step with the setup scripts; an xtask test checks it.
      - run: pipx install pre-commit==4.7.0
      - run: pre-commit run --all-files
        env:
          SKIP: cargo-shear

  check:
    name: cargo xtask check
    needs: scope
    if: needs.scope.outputs.check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The viewer's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev
      - name: The JDK major the latest release needs
        id: jdk
        run: echo "major=$(cargo xtask jdk-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      # The cargo tools setup.sh installs take minutes to compile. Only tools are cached, never
      # anything derived from the game (ADR 0008); the key changes when their versions do.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-shear
            ~/.cargo/bin/mdbook
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}
      - name: Setup
        run: scripts/setup.sh --oracle
      - run: cargo xtask check

  # Windows is the main development OS: the same checks there, set up by setup.ps1 (ADR 0035).
  # The oracle jobs stay on Linux, since their results don't depend on the OS.
  check-windows:
    name: cargo xtask check (Windows)
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest.exe
            ~/.cargo/bin/cargo-shear.exe
            ~/.cargo/bin/mdbook.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-${{ runner.os }}-${{ hashFiles('scripts/setup.ps1') }}
      # setup.ps1 ends with doctor, which fails without the Java the latest release needs. The
      # runner's default is older.
      - name: The JDK major the latest release needs
        id: jdk
        shell: bash
        run: echo "major=$(cargo xtask jdk-status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      - name: Setup
        shell: pwsh
        run: |
          ./scripts/setup.ps1
          # setup.ps1 puts pre-commit on this step's PATH only; later steps need it too.
          "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH
      - run: cargo xtask check

  # The jobs `cargo xtask ci-plan` planned: each makes some of one version's oracle outputs and
  # runs the comparisons that read them (ADR 0058).
  oracle:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.oracle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # spyglass's own build, shared by every oracle job: never target/oracle/, which holds the
      # game's unpacked jars (ADR 0008). Saved only from main, so pull requests don't fill the
      # repository's cache with copies.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/
            target/release/
          key: oracle-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: oracle-build-${{ runner.os }}-
      - name: The JDK major ${{ matrix.version }} needs
        id: jdk
        env:
          GAME_VERSION: ${{ matrix.version }}
        run: |
          echo "major=$(cargo xtask jdk-status --game-version "$GAME_VERSION" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      # `oracle locate` runs Mojang's dedicated server; this accepts the Minecraft EULA for it
      # (https://aka.ms/MinecraftEULA, ADR 0033).
      - run: cargo xtask ci --game-version "$VERSION" --units "$UNITS"
        env:
          VERSION: ${{ matrix.version }}
          UNITS: ${{ matrix.units }}
          SPYGLASS_ACCEPT_EULA: "1"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/
            target/release/
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
