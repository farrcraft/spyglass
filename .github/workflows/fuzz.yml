# Weekly fuzzing of the readers of untrusted files: world saves' NBT and region files (ADR 0036).
# The corpus starts from inputs `cargo xtask fuzz` builds; nothing derived from the game is used.
# A crashing input is kept as an artifact: it's fuzzer output, not game data.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [nbt, region]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly floats here, unlike the pinned toolchain (ADR 0034): this job gates nothing.
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2
      - run: cargo xtask fuzz ${{ matrix.target }} --seconds 1800
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
