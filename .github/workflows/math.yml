# Java's Math on each CI system (docs/specs/java-math.md, ADR 0070).
#
# - test: spyglass-math's committed cases on macOS, whenever the crate changes. Linux and
#   Windows run them in CI's `cargo xtask check`.
# - measure (run by hand): Math's, StrictMath's and correctly rounded results on Linux, macOS
#   and Windows, from the JDK alone, uploaded for `cargo xtask math-report`. These are the JDK's
#   values, not the game's: the game isn't downloaded.
name: Math

on:
  push:
    branches: [main]
    paths: ["crates/spyglass-math/**", ".github/workflows/math.yml"]
  pull_request:
    paths: ["crates/spyglass-math/**", ".github/workflows/math.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: spyglass-math (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain rust-toolchain.toml pins.
      - run: cargo test -p spyglass-math

  measure:
    name: measure ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - run: java oracle/src/spyglass/oracle/JavaMath.java math-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: math-${{ runner.os }}-${{ runner.arch }}
          path: math-out/
          if-no-files-found: error
