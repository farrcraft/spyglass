[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/OWNER/spyglass"
license = "MIT"
publish = false

# Every crate opts in with `[lints] workspace = true`. Warnings fail the hooks (clippy -D warnings).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Widening casts as `T::from`, so every remaining `as` is one that can change a value.
cast_lossless = "warn"
dbg_macro = "warn"
todo = "warn"
# Not enabled, deliberately: suboptimal_flops and imprecise_flops suggest mul_add and other
# rewrites that change floating-point results, which breaks parity with the game.

# rustdoc lints only fire under `cargo doc`, which the hooks run.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[workspace.dependencies]
spyglass-biome = { path = "crates/spyglass-biome" }
spyglass-data = { path = "crates/spyglass-data" }
spyglass-density = { path = "crates/spyglass-density" }
spyglass-noise = { path = "crates/spyglass-noise" }
spyglass-oracle = { path = "crates/spyglass-oracle" }
spyglass-rng = { path = "crates/spyglass-rng" }

anyhow = "1.0.104"
directories = "6.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
md-5 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# arbitrary_precision keeps each number's text, so loaders parse it as the game's codecs do;
# float_roundtrip makes derived f64 parsing correctly rounded (ADRs 0010, 0011).
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "float_roundtrip"] }
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.5.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Hashing and inflating the 62 MB server jar is several times slower unoptimized, and the extractor
# and xtask usually run as debug builds.
[profile.dev.package]
sha1.opt-level = 3
block-buffer.opt-level = 3
zlib-rs.opt-level = 3
crc32fast.opt-level = 3
