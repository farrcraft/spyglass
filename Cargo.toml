[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/OWNER/spyglass"
license = "MIT"
publish = false

[workspace.dependencies]
spyglass-rng = { path = "crates/spyglass-rng" }
spyglass-noise = { path = "crates/spyglass-noise" }
spyglass-density = { path = "crates/spyglass-density" }
spyglass-data = { path = "crates/spyglass-data" }
spyglass-biome = { path = "crates/spyglass-biome" }
spyglass-terrain = { path = "crates/spyglass-terrain" }
spyglass-structure = { path = "crates/spyglass-structure" }
spyglass-search = { path = "crates/spyglass-search" }
