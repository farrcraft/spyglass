[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/OWNER/spyglass"
license = "MIT"
publish = false

[workspace.dependencies]
spyglass-rng = { path = "crates/spyglass-rng" }
spyglass-noise = { path = "crates/spyglass-noise" }
spyglass-density = { path = "crates/spyglass-density" }
spyglass-data = { path = "crates/spyglass-data" }
spyglass-biome = { path = "crates/spyglass-biome" }
spyglass-terrain = { path = "crates/spyglass-terrain" }
spyglass-structure = { path = "crates/spyglass-structure" }
spyglass-search = { path = "crates/spyglass-search" }
spyglass-oracle = { path = "crates/spyglass-oracle" }

anyhow = "1.0.104"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = "3.5.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
