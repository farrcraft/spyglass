[package]
name = "spyglass-cli"
description = "The spyglass command: locate structures, biomes, slime chunks and the spawn, for people or scripts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The binary shares the library crate's name, so it's left out of `cargo doc`.
[[bin]]
name = "spyglass"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
spyglass.workspace = true

[dev-dependencies]
spyglass-data.workspace = true
tempfile.workspace = true
