[package]
name = "spyglass"
description = "The spyglass public API: a version bundle loaded once, and seed-bound sessions with locate queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Coarse timing of terrain (`spyglass::timing`), for the `density_timing` example.
timing = ["spyglass-terrain/timing"]

[[example]]
name = "density_timing"
required-features = ["timing"]

[dependencies]
spyglass-biome.workspace = true
spyglass-data.workspace = true
spyglass-search.workspace = true
spyglass-structure.workspace = true
spyglass-terrain.workspace = true
spyglass-world.workspace = true
png.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
spyglass-oracle.workspace = true
tempfile.workspace = true
