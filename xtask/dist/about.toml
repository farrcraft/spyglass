# cargo-about's config for THIRD-PARTY-LICENSES.html in release archives (ADR 0038).
# `accepted` must equal deny.toml's [licenses] allow; an xtask test checks it.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
# The release targets, so platform-only dependencies of each are listed.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
# Tests' dependencies aren't in the binaries.
ignore-dev-dependencies = true
# spyglass's own crates (publish = false) are spyglass, under LICENSE, not third parties.
[private]
ignore = true
